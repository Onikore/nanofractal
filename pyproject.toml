[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nanofractal"
version = "0.2.0"
description = "High-performance fiducial marker detection (ArUco Nano v6 + Fractal)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-benchmark>=4"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/nanofractal"]
cmake.build-type = "Release"

# Forward NF_MARCH from the environment into CMake so CI can set
# an ISA baseline (x86-64-v3) without touching the CMakeLists.
[tool.scikit-build.cmake.define]
NF_MARCH = {env = "NF_MARCH", default = ""}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# Portable manylinux wheels with a minimal static OpenCV linked in (built once
# per platform by ci/build-opencv.sh). Linux x86_64, CPython 3.9-3.13.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* pp* *_i686 *-win32"
before-all = "bash ci/build-opencv.sh"
test-requires = "pytest numpy"
test-command = "python -m pytest {project}/tests -q --ignore {project}/tests/test_benchmarks.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# CMAKE_PREFIX_PATH: static OpenCV built by before-all.
# NF_MARCH: x86-64-v3 = AVX2+FMA+BMI (Haswell 2013+); safe floor for 2024 machines.
environment = { CMAKE_PREFIX_PATH = "/opt/opencv-static", NF_MARCH = "x86-64-v3" }
