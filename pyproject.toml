[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nanofractal"
version = "0.5.0"
description = "High-performance fiducial marker detection (ArUco Nano v6 + Fractal)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Dmitry", email = "demon5326@gmail.com" }]
keywords = ["aruco", "fiducial", "marker", "fractal", "pose", "opencv", "detection"]
dependencies = ["numpy>=1.21"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Onikore/nanofractal"
Source = "https://github.com/Onikore/nanofractal"
Changelog = "https://github.com/Onikore/nanofractal/blob/main/CHANGELOG.md"
Issues = "https://github.com/Onikore/nanofractal/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-benchmark>=4", "pytest-cov>=4"]
bench = ["opencv-python>=4.5"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/nanofractal"]
cmake.build-type = "Release"

# Forward NF_MARCH from the environment into CMake so CI can set
# an ISA baseline (x86-64-v3) without touching the CMakeLists.
[tool.scikit-build.cmake.define]
NF_MARCH = {env = "NF_MARCH", default = ""}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# Portable manylinux wheels with a minimal static OpenCV linked in (built once
# per platform by ci/build-opencv.sh). Linux x86_64, CPython 3.9-3.13.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* pp* *_i686 *-win32"
before-all = "bash ci/build-opencv.sh"
test-requires = "pytest numpy"
test-command = "python -m pytest {project}/tests -q --ignore {project}/tests/test_benchmarks.py"
# Under QEMU emulation aarch64 tests are very slow; run only one CPython to
# keep wall-clock time reasonable. x86_64 runs all five (no skip pattern matches).
test-skip = "cp39-*_aarch64 cp310-*_aarch64 cp311-*_aarch64 cp313-*_aarch64"

[tool.cibuildwheel.linux]
# aarch64 builds run under QEMU emulation in CI — expect them to be significantly
# slower than native x86_64 builds (roughly 4–8× slower per wheel).
archs = ["x86_64", "aarch64"]
# CMAKE_PREFIX_PATH: static OpenCV built by before-all.
# NF_MARCH: x86-64-v3 = AVX2+FMA+BMI (Haswell 2013+); safe floor for 2024 machines.
# CMakeLists.txt ignores NF_MARCH on aarch64 (see arch-tuning block).
environment = { CMAKE_PREFIX_PATH = "/project/.opencv-cache", NF_MARCH = "x86-64-v3" }

[tool.cibuildwheel.windows]
# ponytail: AMD64 only — win32 is already excluded in [tool.cibuildwheel].skip.
archs = ["AMD64"]
# Provision the OpenCV 4.10.0 Windows prebuilt (7-zip SFX from GitHub releases).
# This overrides the global before-all ("bash ci/build-opencv.sh") for Windows so
# the Linux static-build script is never attempted on the Windows runner.
before-all = "pwsh -NoProfile -File ci\\build-opencv-windows.ps1"
# CMAKE_PREFIX_PATH points find_package(OpenCV) directly at the vc16 (MSVC-2019)
# config dir, NOT the top-level build/ dir. The top-level OpenCVConfig.cmake
# auto-selects binaries by MSVC version and rejects toolchains newer than it
# knows ("no binaries compatible") — and the windows runner now ships VS2026.
# The vc16/lib config defines the targets directly, bypassing that dispatch.
# The runner is pinned to windows-2022 (v143) in release.yml, which is ABI-
# compatible with these v142 binaries (MSVC v140–v143 binary-compat guarantee).
# FORWARD slashes: backslashes get mangled by cibuildwheel's Windows env parser.
# ponytail: C:/nf-opencv matches $DEST in build-opencv-windows.ps1. Ceiling: on
#           an OpenCV bump vc16 may become vc17; if the prebuilt drops a runner-
#           compatible vc, switch to a vcpkg source build of opencv4.
environment = { CMAKE_PREFIX_PATH = "C:/nf-opencv/opencv/build/x64/vc16/lib" }
# delvewheel must bundle opencv_world4100.dll; give it the DLL dir explicitly
# (forward slashes) instead of routing a backslash PATH through the env parser.
repair-wheel-command = "delvewheel repair --add-path C:/nf-opencv/opencv/build/x64/vc16/bin -w {dest_dir} {wheel}"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["third_party", "build", "example.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E501"]
