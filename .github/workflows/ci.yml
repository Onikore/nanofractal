name: ci

# One workflow, one run (and one notification) per push; all jobs start at
# once and a newer push to the same branch cancels the run in progress. The
# docs site (guide/ -> GitHub Pages) is built on every run and published from
# main only. Changes to notes only skip CI (README.md and guide/ are not
# skipped: their Python examples are run by tests/test_guide.py).
#
# Speed: compiled objects are cached across runs by sccache (the extension and
# nanobind rebuild only what changed; builds use fixed paths -- no build
# isolation, build-dir from pyproject.toml -- so the cache keys match), the
# static OpenCV 5 is cached, pip and pre-commit downloads are cached, and the tests run on every core
# (pytest-xdist, work stealing).

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "RPI_TEST_PLAN.md"
      - "DEV.md"
      - "PUBLISHING.md"
      - "PATCHES.md"
      - "LICENSE"
      - "benchmarks/README.md"
      - "benchmarks/real_images/**"
      - "examples/README.md"
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "RPI_TEST_PLAN.md"
      - "DEV.md"
      - "PUBLISHING.md"
      - "PATCHES.md"
      - "LICENSE"
      - "benchmarks/README.md"
      - "benchmarks/real_images/**"
      - "examples/README.md"
  workflow_dispatch:
    inputs:
      base:
        description: "bench: base commit, tag or branch (default: the previous commit)"
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENCV_VERSION: "5.0.0"
  # sccache: compiler launcher for CMake (read from the environment), objects
  # kept in the GitHub Actions cache
  SCCACHE_GHA_ENABLED: "true"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  # build requirements, installed once so builds need no isolated environment
  BUILD_DEPS: "scikit-build-core>=0.10 nanobind>=2.1.0 cmake ninja"
  PYTEST_ARGS: "-q -n auto --dist worksteal --ignore tests/test_benchmarks.py"

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  test:
    name: test (system OpenCV 4, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # testing the distribution's OpenCV is the point of this job (a cache of
      # the apt packages was tried: restored files miss the update-alternatives
      # links, e.g. liblapack.so.3)
      - name: Install OpenCV dev headers
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Build and install
        run: |
          pip install $BUILD_DEPS
          pip install --no-build-isolation -e ".[test]"
      - name: Run tests
        run: python -m pytest tests $PYTEST_ARGS --cov=nanofractal --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-opencv5:
    name: test (static OpenCV 5, AVX2)
    runs-on: ubuntu-latest
    env:
      OPENCV_CACHE_DIR: ${{ github.workspace }}/.opencv5
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.opencv5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      # static OpenCV 5, shared by the jobs below (restored in ~1 s; apt takes
      # 0.5-7 min depending on the mirror)
      - name: Cache static OpenCV 5
        uses: actions/cache@v4
        with:
          path: .opencv5
          key: opencv5-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build static OpenCV 5
        run: bash ci/build-opencv.sh
      - name: Build and install
        run: |
          pip install $BUILD_DEPS
          pip install --no-build-isolation -e ".[test]"
        env:
          NF_MARCH: x86-64-v3
      - name: Check the linked OpenCV
        run: python -c "import nanofractal as nf; v = nf._opencv_version(); print(v); assert v.startswith('5.')"
      - name: Run tests
        run: python -m pytest tests $PYTEST_ARGS

  types:
    name: stubs (stubtest)
    runs-on: ubuntu-latest
    env:
      OPENCV_CACHE_DIR: ${{ github.workspace }}/.opencv5
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.opencv5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Cache static OpenCV 5
        uses: actions/cache@v4
        with:
          path: .opencv5
          key: opencv5-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build static OpenCV 5
        run: bash ci/build-opencv.sh
      - name: Build and install
        run: |
          pip install $BUILD_DEPS mypy
          pip install --no-build-isolation -e ".[test]"
      - name: Check stub freshness
        run: python -m mypy.stubtest nanofractal --allowlist tests/stubtest_allowlist.txt

  asan:
    name: ASan / UBSan
    runs-on: ubuntu-latest
    env:
      OPENCV_CACHE_DIR: ${{ github.workspace }}/.opencv5
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.opencv5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Cache static OpenCV 5
        uses: actions/cache@v4
        with:
          path: .opencv5
          key: opencv5-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build static OpenCV 5
        run: bash ci/build-opencv.sh
      - name: Build with ASan / UBSan
        run: |
          pip install $BUILD_DEPS numpy pytest pytest-xdist
          pip install --no-build-isolation -C cmake.define.NF_SANITIZE=ON -e .
      - name: Run tests under sanitizers
        # libstdc++ is preloaded with libasan: ASan LD_PRELOAD-ed into a
        # non-ASan Python otherwise fails to resolve __cxa_throw on the first
        # C++ exception (input validation throws constantly). detect_leaks=0:
        # LeakSanitizer is noise on a dlopened extension linked against a
        # non-instrumented OpenCV; overflow / use-after-free checks stay on.
        # The workers inherit LD_PRELOAD and write reports to the job log.
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1"
          PYTHONMALLOC: "malloc"
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so)" \
            python -m pytest tests $PYTEST_ARGS -s

  docs:
    name: docs site (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs.yml
      # pinned: MkDocs 2.0 drops the plugin and theme system Material uses
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - run: mkdocs build --strict -d site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: publish docs (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, docs, test, test-opencv5]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  bench:
    # Speed gate: the base commit and this one, same static OpenCV 5, one core,
    # three alternating rounds (drift of the runner hits both); fails when the
    # geometric mean of the cells is above x1.10 or one cell above x1.25.
    name: speed gate
    runs-on: ubuntu-latest
    env:
      OPENCV_CACHE_DIR: ${{ github.workspace }}/.opencv5
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.opencv5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Cache static OpenCV 5
        uses: actions/cache@v4
        with:
          path: .opencv5
          key: opencv5-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build static OpenCV 5
        run: bash ci/build-opencv.sh
      - name: Pick the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.base }}
        run: |
          base="${INPUT:-${PR_BASE:-$BEFORE}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD^
          fi
          echo "BASE=$(git rev-parse "$base")" >> "$GITHUB_ENV"
          git log -1 --oneline "$base"
      - name: Build new and base
        # Both in the checkout, one after the other: the base build has the
        # paths the previous run's build had, so its objects come from sccache.
        run: |
          pip install $BUILD_DEPS
          cp benchmarks/fractal_bench.py "$RUNNER_TEMP/"
          pip wheel -q --no-build-isolation --no-deps -w "$RUNNER_TEMP/wn" .
          git checkout -q "$BASE"
          pip wheel -q --no-build-isolation --no-deps -w "$RUNNER_TEMP/wb" .
          git checkout -q -
          python -m venv "$RUNNER_TEMP/vb" && python -m venv "$RUNNER_TEMP/vn"
          "$RUNNER_TEMP/vb/bin/pip" install -q "$RUNNER_TEMP"/wb/*.whl
          "$RUNNER_TEMP/vn/bin/pip" install -q "$RUNNER_TEMP"/wn/*.whl
      - name: Time both, alternating rounds
        # outside the checkout, so each venv imports its own build
        run: |
          cd "$RUNNER_TEMP"
          args="run --threads 1 --modes detect --resolutions 640x480 1280x720 1920x1080 --min-time 1"
          for i in 1 2 3; do
            vb/bin/python fractal_bench.py $args --json b$i.json > /dev/null
            vn/bin/python fractal_bench.py $args --json n$i.json > /dev/null
          done
      - name: Gate
        run: |
          cd "$RUNNER_TEMP"
          vn/bin/python fractal_bench.py gate --base b1.json b2.json b3.json --new n1.json n2.json n3.json
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
