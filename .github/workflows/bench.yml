name: bench

# Speed regression gate: builds the base commit and this one with the same
# system OpenCV, times both on one core in alternating rounds (so drift of the
# runner hits both) and fails when the new build is slower: geometric mean of
# the cells above x1.10 or one cell above x1.25 (fractal_bench.py gate).

on:
  push:
    branches: [main]
    paths: ["src/**", "third_party/**", "CMakeLists.txt", "pyproject.toml",
            "benchmarks/fractal_bench.py", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["src/**", "third_party/**", "CMakeLists.txt", "pyproject.toml",
            "benchmarks/fractal_bench.py", ".github/workflows/bench.yml"]
  workflow_dispatch:
    inputs:
      base:
        description: "base commit, tag or branch (default: the parent commit)"
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenCV dev headers
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Pick the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.base }}
        run: |
          base="${INPUT:-${PR_BASE:-$BEFORE}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD^
          fi
          echo "BASE=$(git rev-parse "$base")" >> "$GITHUB_ENV"
          git log -1 --oneline "$base"
      - name: Build base and new
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          python -m venv "$RUNNER_TEMP/vb" && python -m venv "$RUNNER_TEMP/vn"
          "$RUNNER_TEMP/vb/bin/pip" install -q "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/vn/bin/pip" install -q .
      - name: Time both, alternating rounds
        # Run outside the checkout so each venv imports its own build.
        run: |
          cp benchmarks/fractal_bench.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          args="run --threads 1 --modes detect --resolutions 640x480 1280x720 1920x1080 --min-time 1"
          for i in 1 2 3; do
            vb/bin/python fractal_bench.py $args --json b$i.json > /dev/null
            vn/bin/python fractal_bench.py $args --json n$i.json > /dev/null
          done
      - name: Gate
        run: |
          cd "$RUNNER_TEMP"
          vn/bin/python fractal_bench.py gate --base b1.json b2.json b3.json --new n1.json n2.json n3.json
