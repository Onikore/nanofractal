name: release

# Build portable wheels (manylinux x86_64/aarch64, macOS arm64/x86_64, Windows
# AMD64) + sdist and publish to PyPI on a version tag, then create the GitHub
# Release of that tag (notes from CHANGELOG.md, the wheels and sdist attached).
# Push a tag like v0.1.0 to trigger a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels linux ${{ matrix.arch }}
    # aarch64 builds natively on GitHub's arm64 runner (no QEMU), so its wheels
    # run the full test-suite like x86_64.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Cache static OpenCV
        uses: actions/cache@v4
        with:
          path: .opencv-cache
          key: opencv-${{ matrix.arch }}-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  wheels_macos:
    name: wheels macos ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-14 }
          - { arch: x86_64, os: macos-15-intel }
    env:
      OPENCV_CACHE_DIR: ${{ github.workspace }}/.opencv-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache static OpenCV
        uses: actions/cache@v4
        with:
          path: .opencv-cache
          key: opencv-macos-${{ matrix.arch }}-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  wheels_windows:
    name: wheels windows AMD64
    # Pinned: the prebuilt OpenCV 4.10.0 ships vc16 (MSVC v142) binaries.
    # windows-2022 is VS2022 (v143), ABI-compatible with v142. windows-latest
    # has moved to VS2026 (v145), which OpenCV's pack rejects as incompatible.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: AMD64
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-windows
          path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, wheels_macos, wheels_windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # OIDC Trusted Publishing, no stored PyPI token: the PyPI project has a
    # GitHub publisher (owner Onikore, repo nanofractal, workflow release.yml,
    # environment pypi), see PUBLISHING.md.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on = 1; next}
                         on && /^## \[/ {exit}
                         on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          printf '\n**Install:** `pip install nanofractal==%s` · **Docs:** %s\n' \
            "$v" "https://onikore.github.io/nanofractal/" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag
          --title "nanofractal ${GITHUB_REF_NAME#v}" --notes-file notes.md
