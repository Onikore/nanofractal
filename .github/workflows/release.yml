name: release

# Build portable manylinux wheels + sdist and publish to PyPI on a version tag.
# Push a tag like v0.1.0 to trigger a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, qemu: false }
          - { arch: aarch64, qemu: true }
    steps:
      - uses: actions/checkout@v4
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Cache static OpenCV
        uses: actions/cache@v4
        with:
          path: .opencv-cache
          key: opencv-${{ matrix.arch }}-${{ hashFiles('ci/build-opencv.sh') }}
      - name: Build wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  wheels_windows:
    name: wheels windows AMD64
    # Pinned: the prebuilt OpenCV 4.10.0 ships vc16 (MSVC v142) binaries.
    # windows-2022 is VS2022 (v143), ABI-compatible with v142. windows-latest
    # has moved to VS2026 (v145), which OpenCV's pack rejects as incompatible.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: AMD64
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-windows
          path: wheelhouse/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, wheels_windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # OIDC Trusted Publishing — no stored PyPI token. REQUIRES a one-time PyPI
    # setup: project -> Publishing -> add a GitHub publisher (owner: Onikore,
    # repo: nanofractal, workflow: release.yml, environment: pypi). Until that
    # exists on PyPI, the publish step fails — configure it before the next tag.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
